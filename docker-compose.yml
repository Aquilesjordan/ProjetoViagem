services:
  postgresql:
    container_name: viagens_db
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: viagens
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d viagens"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - spring_network

  app:
    build: .
    container_name: viagens_app
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresql:5432/viagens
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8081
      SECURITY_JWT_SECRET: changeitchangeitchangeitchangeit
      SECURITY_JWT_EXPIRATION_SECONDS: 28800
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - spring_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: viagens_frontend
    ports:
      - "5173:80"
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - spring_network

volumes:
  db_data:

networks:
  spring_network:
    driver: bridge
